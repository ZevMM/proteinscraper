[project]
name = "protein-scraper"
version = "0.1.0"
description = "Discovery + extraction pipeline for protein powder listings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "selectolax>=0.3.21",
    "extruct>=0.17",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.5",
    "cryptography>=43.0",
]

[project.scripts]
scraper = "protein_scraper.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protein_scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer uses function calls (Option/Argument) in argument defaults by design.
"src/protein_scraper/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
