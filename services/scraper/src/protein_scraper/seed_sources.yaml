    type: shopify
    base_url: https://www.jackedfactory.com
    config:
      max_pages: 3

  - slug: bpn
    name: Bare Performance Nutrition
    type: shopify
    base_url: https://bpnsupps.com
    config:
      max_pages: 3

  - slug: promix
    name: Promix Nutrition
    type: shopify
