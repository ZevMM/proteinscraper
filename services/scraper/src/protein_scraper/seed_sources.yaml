    name: Bodybuilding.com
    type: shopify
    base_url: https://shop.bodybuilding.com
    config:
      max_pages: 2

  # Kroger via the official Products API (OAuth client-credentials, free).
  # Returns authentic per-store grocery prices + a 13-digit base UPC (enables
  # cross-source dedup + Open Food Facts nutrition). No-ops until
  # KROGER_CLIENT_ID + KROGER_CLIENT_SECRET are set. Price requires a store, so
  # the connector resolves one from `zip_code`.
  - slug: kroger
    name: Kroger
    type: kroger
    base_url: https://www.kroger.com
    config:
      max_pages: 2
      zip_code: "45202"

  # eBay via the official Browse API (OAuth client-credentials application token).
  # Restricted to brand-new, fixed-price, reputable-seller listings for price
  # accuracy. getItem recovers GTIN/UPC for dedup. enabled:false keeps it out of
  # the daily --all run (rate/quota-sensitive); run via `run --source ebay`.
  # No-ops until EBAY_CLIENT_ID + EBAY_CLIENT_SECRET are set.
  - slug: ebay
    name: eBay
    type: ebay
    base_url: https://www.ebay.com
    enabled: false
    config:
      max_pages: 1
      fetch_details: true

  # eBay UK — same Browse API + keys, EBAY_GB marketplace (prices in GBP).
  - slug: ebay-uk
    name: eBay UK
    type: ebay
    market: UK
    base_url: https://www.ebay.co.uk
    enabled: false
    config:
      marketplace: EBAY_GB
      max_pages: 1
      fetch_details: true

  # Walmart via the official IO Affiliate API. No-ops until WALMART_CONSUMER_ID +
  # WALMART_PRIVATE_KEY (+ WALMART_KEY_VERSION) are set in the environment.
  - slug: walmart
    name: Walmart
    type: walmart
    base_url: https://www.walmart.com
    # queries omitted -> uses the connector's broadened default set.
    config:
      max_pages: 2

  # Amazon via the RapidAPI "Real-Time Amazon Data" provider. enabled:false keeps
  # it out of the daily --all run; a separate weekly workflow runs it explicitly
  # (it bills per request). No-ops until RAPIDAPI_KEY is set.
  # Search returns ~48 results/page and each product costs a 2nd call for
  # details, so keep max_pages low to control RapidAPI cost (~1 page x 4
  # queries x 2 calls ~= 380 requests/run).
  - slug: amazon
    name: Amazon
    type: amazon
    base_url: https://www.amazon.com
    enabled: false
    config:
      max_pages: 1
      country: US
      fetch_details: true
      queries:
        - whey protein powder
        - plant protein powder
        - casein protein powder
        - protein isolate powder

  # Amazon UK — same RapidAPI provider, country=GB (prices in GBP). Billed per
  # request, so run weekly via its own workflow (enabled:false keeps it out of
  # the daily --all sweep).
  - slug: amazon-uk
    name: Amazon UK
    type: amazon
    market: UK
    base_url: https://www.amazon.co.uk
    enabled: false
    config:
      max_pages: 1
      country: GB
      fetch_details: true
      queries:
        - whey protein powder
        - plant protein powder
        - casein protein powder
        - protein isolate powder

  # Amazon India — same RapidAPI provider, country=IN (prices in INR). Shares the
  # exhausted RapidAPI quota with the other Amazon markets, so it stays disabled
  # until the plan is upgraded; seeded for readiness.
  - slug: amazon-in
    name: Amazon India
    type: amazon
    market: IN
    base_url: https://www.amazon.in
    enabled: false
    config:
      max_pages: 1
      country: IN
      fetch_details: true
      queries:
        - whey protein powder
        - plant protein powder
        - casein protein powder
        - protein isolate powder

