# Seed sources for the MVP: US direct-to-consumer protein brands on Shopify.
# Each exposes a public /products.json feed (no API key, ToS-friendly).
# `enabled: false` keeps a source defined but out of scheduled runs.
#
# config keys (all optional):
#   max_pages          int    pages of /products.json to fetch (250 products/page)
#   include_keywords   [str]  product must match one (default: ["protein"])
#   exclude_keywords   [str]  product must match none

sources:
  - slug: kaged
    name: Kaged
    type: shopify
    base_url: https://www.kaged.com
    config:
      max_pages: 3

