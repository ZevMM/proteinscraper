services:
  db:
    image: postgres:16-alpine
    container_name: protein-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: protein
      POSTGRES_PASSWORD: protein
      POSTGRES_DB: protein
    ports:
      - "5432:5432"
    volumes:
      - protein-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protein -d protein"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  protein-db-data:
