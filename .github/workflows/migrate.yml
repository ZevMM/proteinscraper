name: Migrate prod DB

# Applies committed Prisma migrations to the production (Neon) database without
# running a scrape. Run this after merging a schema migration and BEFORE deploying
# web code that reads new columns, so the DB is ahead of the app (expand/contract).
on:
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @proteinscraper/db migrate:deploy
